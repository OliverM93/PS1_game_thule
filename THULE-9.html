/* ======================= 2. HILFSFUNKTIONEN ======================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const rand = (a, b) => a + Math.random() * (b - a);
const fmtTime = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

/* ======================= 3. PALETTE, PIXELFONT, TEXTUREN ======================= */

const FONT = {};
FONT_SRC.trim().split('\n').forEach(line => {
  const p = line.trim().split(/\s+/); if (p.length < 8) return;
  FONT[p[0]] = p.slice(1, 8).map(r => { let b = 0; for (let i = 0; i < 5; i++) if (r[i] === '#') b |= 1 << (4 - i); return b; });
});
FONT[' '] = [0, 0, 0, 0, 0, 0, 0];
const GLYPHS = Object.keys(FONT);
const GLYPH_IDX = {}; GLYPHS.forEach((g, i) => GLYPH_IDX[g] = i);
const fontAtlas = {};
function getAtlas(color) { // eingefärbter Glyphen-Atlas, gecacht pro Farbe
  if (fontAtlas[color]) return fontAtlas[color];
  const c = document.createElement('canvas'); c.width = GLYPHS.length * 6; c.height = 7;
  const g = c.getContext('2d'); g.fillStyle = color;
  GLYPHS.forEach((ch, i) => { const rows = FONT[ch];
    for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (rows[y] & (1 << (4 - x))) g.fillRect(i * 6 + x, y, 1, 1); });
  return (fontAtlas[color] = c);
}
function normText(s) {
  return String(s).toUpperCase().replace(/…/g, '...').replace(/[–—]/g, '-').replace(/[„“”«»]/g, '"').replace(/[‚‘’´`]/g, "'");
}
function drawRaw(g, s, x, y, color, scale) {
  const at = getAtlas(color);
  for (let i = 0; i < s.length; i++) {
    const idx = GLYPH_IDX[s[i]]; if (idx === undefined || s[i] === ' ') continue;
    g.drawImage(at, idx * 6, 0, 5, 7, Math.round(x + i * 6 * scale), Math.round(y), 5 * scale, 7 * scale);
  }
}
function drawText(g, s, x, y, color = '#dfe6ee', scale = 1, shadow = true) {
  s = normText(s);
  if (shadow) drawRaw(g, s, x + scale, y + scale, '#05060a', scale);
  drawRaw(g, s, x, y, color, scale);
}
const textW = (s, scale = 1) => normText(s).length * 6 * scale - scale;
function wrapText(s, max) { // Zeilenumbruch nach Zeichenanzahl (Monospace-Font)
  const out = [];
  String(s).split('\n').forEach(par => {
    if (!par.trim()) { out.push(''); return; }
    let line = '';
    par.split(' ').forEach(w => {
      if (!line) line = w; else if ((line + ' ' + w).length <= max) line += ' ' + w; else { out.push(line); line = w; }
    });
    out.push(line);
  });
  return out;
}

// --- Prozedurale Texturen (Canvas, 16–64 px, Palette-Indizes, kein Filtering, keine Mipmaps) ---
const TEX = {};
const TEXW = {}; // Weltgröße einer Texturwiederholung [u, v] in Metern ('stretch' = pro Fläche gestreckt)
function finishTex(name, c) {
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  TEX[name] = t; return t;
}
function genTex(name, w, h, fn, world) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); const img = g.createImageData(w, h); const d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const v = fn(x, y); const i = (y * w + x) * 4;
    if (v === -1 || v == null) { d[i + 3] = 0; continue; }
    const col = Array.isArray(v) ? v : PAL_RGB[clamp(v | 0, 0, 15)];
    d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  TEXW[name] = world || [1, 1];
  return finishTex(name, c);
}
function buildTextures() {
  const N = (x, y, s = 1) => hash2(x, y, s);
  genTex('grate', 32, 32, (x, y) => { // Gitterrost
    const gx = x % 16, gy = y % 16;
    if (gx === 0 || gy === 0) return 1; if (gx === 1 || gy === 1) return 4;
    if (gx > 2 && gx < 14 && gy > 2 && gy < 14) return ((x + y) % 4 === 0 || (x - y + 64) % 4 === 0) ? 0 : 2;
    return N(x, y) < 0.2 ? 2 : 3;
  });
  genTex('panel', 64, 64, (x, y) => { // Wandpaneel mit Sockel, Nieten, Schmutz
    const px = x % 32;
    if (px === 0) return 1; if (px === 1) return 4;
    if (y === 40) return 1; if (y === 41) return 4;
    if (y >= 52) { if (y === 52) return 1; return (((x + y) >> 2) % 2 === 0) ? 2 : 1; }
    if ((px === 5 || px === 27) && (y === 5 || y === 35 || y === 46)) return 5;
    if (y < 40 && px > 8 && px < 24 && y > 10 && y < 30) {
      if (px === 9 || y === 11) return 2; if (px === 23 || y === 29) return 4;
      return N(x, y) < 0.06 ? 2 : 3;
    }
    const n = N(x, y); if (n < 0.07) return 2; if (n > 0.97) return 4;
    return (N(x >> 3, y >> 2, 3) < 0.25) ? 2 : 3;
  }, [2, 3]);
  genTex('ceil', 32, 32, (x, y) => { const gx = x % 16, gy = y % 16;
    if (gx === 0 || gy === 0) return 0; if (gx > 5 && gx < 11 && gy > 5 && gy < 11) return ((gx + gy) % 2) ? 1 : 0;
    return N(x, y) < 0.15 ? 1 : 2; }, [2, 2]);
  genTex('concrete', 32, 32, (x, y) => { const n = N(x, y), m = N(x >> 2, y >> 2, 5);
    if (n < 0.08) return 2; if (n > 0.96) return 5; if (N(x, y >> 3, 8) < 0.03) return 1; return m < 0.3 ? 3 : 4; }, [1.5, 1.5]);
  genTex('labtile', 32, 32, (x, y) => { if (x % 8 === 0 || y % 8 === 0) return 4;
    const n = N(x, y); if (n < 0.05) return 5; return (N(x >> 3, y >> 3, 7) < 0.3) ? 6 : 7; }, [1, 1]);
  genTex('labwall', 64, 64, (x, y) => { const px = x % 32; if (px === 0) return 4;
    if (y === 16 || y === 48) return 4; if (y >= 38 && y <= 42) return 13; if (y >= 52) return 5;
    return N(x, y) < 0.06 ? 5 : 6; }, [2, 3]);
  genTex('crate', 32, 32, (x, y) => {
    if (x < 3 || y < 3 || x > 28 || y > 28) return (x === 0 || y === 0 || x === 31 || y === 31) ? 0 : 15;
    if (Math.abs(x - y) < 2 || Math.abs(x + y - 31) < 2) return 15;
    if (y % 6 === 0) return 1; return N(x, y) < 0.15 ? 2 : 13; }, [1, 1]);
  genTex('locker', 32, 64, (x, y) => {
    if (x === 0 || x === 15 || x === 16 || x === 31 || y === 0 || y === 63) return 1;
    const lx = x % 16;
    if (y > 6 && y < 20 && lx > 3 && lx < 12 && y % 3 === 0) return 0;
    if (lx === 12 && y > 28 && y < 36) return 6;
    if (y > 44 && y < 48 && lx > 4 && lx < 11) return 10;
    return N(x, y) < 0.1 ? 12 : 13; }, [1, 2]);
  genTex('metal', 32, 32, (x, y) => { const n = N(x, y); if (N(x >> 1, y, 9) < 0.04) return 6;
    return n < 0.15 ? 3 : (n > 0.93 ? 5 : 4); }, [1, 1]);
  genTex('machine', 32, 32, (x, y) => {
    if (y < 5) return (((x + y) >> 2) % 2) ? 10 : 0; if (y === 5) return 1; if (x % 16 === 0) return 1;
    if (y > 10 && y < 22 && x % 16 > 3 && x % 16 < 13) return (y % 2) ? 0 : 2;
    if ((x % 16 === 2 || x % 16 === 14) && (y === 8 || y === 28)) return 5;
    return N(x, y) < 0.12 ? 2 : 3; }, [1, 1]);
  genTex('hazard', 32, 32, (x, y) => ((((x + y) >> 3) % 2) ? 10 : 0), [0.6, 0.6]);
  genTex('terminal', 32, 32, (x, y) => {
    if (x < 3 || y < 3 || x > 28 || y > 24) return y > 26 ? 2 : 1;
    if (y % 4 === 1 && x > 4 && x < 6 + (N(0, y >> 2, 4) * 20 | 0)) return 14; return 12; }, 'stretch');
  genTex('radio', 32, 32, (x, y) => {
    if (x < 1 || y < 1 || x > 30 || y > 30) return 0;
    if (x < 14 && y > 6 && y < 26) return (x % 2 === 0) ? 0 : 2;
    const d = Math.hypot(x - 21, y - 12); if (d < 5) return d < 1.5 ? 7 : (d < 4 ? 4 : 1);
    if (y > 20 && y < 24 && x > 17 && x < 28) return (x === 22) ? 11 : 10; return 2; }, 'stretch');
  const doorFn = (base, acc) => (x, y) => {
    if (x < 2 || x > 29 || y < 2) return 1; if (x === 2 || y === 2) return base + 1;
    if (y > 54) return (((x + y) >> 2) % 2) ? acc : 0;
    if (y > 10 && y < 22 && x > 9 && x < 22) return (y === 11 || x === 10) ? 0 : 12;
    if (x === 15 || x === 16) return 1;

  genTex('doorLab', 32, 64, doorFn(5, 13), 'stretch');
  genTex('doorHeavy', 32, 64, (x, y) => { if (x < 2 || x > 29 || y < 2) return 1;
    if (y > 46 || y < 9) return (((x + y) >> 2) % 2) ? 11 : 0; if (y % 9 === 0) return 2;
    if ((x === 5 || x === 26) && y % 9 === 4) return 6; return N(x, y) < 0.08 ? 2 : 4; }, 'stretch');
  genTex('ice', 32, 32, (x, y) => { const n = N(x, y), m = N(x >> 2, y >> 2, 11); return n < 0.1 ? 5 : (m < 0.5 ? 6 : 7); }, [1, 1]);
  genTex('blood', 32, 32, (x, y) => { // Cutout-Decal
    const dx = x - 16, dy = y - 16, d = Math.sqrt(dx * dx + dy * dy);
    const r = 8 + N(Math.round(Math.atan2(dy, dx) * 3), 0, 13) * 7;

    if (N(x, y, 2) < 0.05 && d < 15) return 8; return -1; }, 'stretch');
  genTex('glass', 32, 32, (x, y) => { if (x % 16 === 3 || x % 16 === 4) return 14; if (N(x, y) < 0.1) return 13; return 12; }, [1.4, 2.1]);
  genTex('shelf', 32, 32, (x, y) => {
    if (y % 16 < 2) return y % 16 === 0 ? 1 : 5; if (x < 2 || x > 29) return 4;
    const kind = (N(x >> 3, y >> 4, 21) * 5) | 0;
    if (y % 16 > 4 && kind > 0 && x % 8 > 0 && x % 8 < 7) return [0, 10, 12, 15, 3][kind]; return 0; }, [1, 1.2]);
  genTex('shelfLab', 32, 32, (x, y) => {
    if (y % 16 < 2) return y % 16 === 0 ? 4 : 6; if (x < 2 || x > 29) return 5;
    const k = (N(x >> 2, y >> 4, 31) * 4) | 0;

  genTex('cot', 32, 32, (x, y) => { if (y < 6) return 6; return ((x >> 2) % 2) ? 12 : 1; }, 'stretch');
  genTex('carpet', 32, 32, (x, y) => { const n = N(x, y); return n < 0.3 ? 1 : (n < 0.6 ? 12 : 2); }, [1, 1]);
  genTex('pipe', 16, 16, (x, y) => { if (x % 8 === 0) return 2; return y < 5 ? 5 : (y < 11 ? 4 : 3); }, [0.6, 0.6]);
  genTex('paper', 16, 16, (x, y) => { if (x < 1 || x > 14 || y < 1 || y > 14) return 5; if (y % 3 === 0 && x > 2 && x < 13) return 4; return 7; }, 'stretch');

  genTex('vent', 32, 32, (x, y) => { if (x < 2 || y < 2 || x > 29 || y > 29) return 4; return (y % 4 < 2) ? 0 : 3; }, 'stretch');
  genTex('window', 32, 32, (x, y) => { if (x < 2 || y < 2 || x > 29 || y > 29) return 2; if (x === 16) return 3; return N(x, y) < 0.3 ? 6 : 7; }, 'stretch');
  genTex('flesh', 16, 16, (x, y) => (N(x, y) < 0.12 ? [150, 60, 60] : (N(x >> 1, y, 3) < 0.3 ? [200, 205, 210] : [235, 238, 240])), [0.3, 0.3]);
  genTex('parka', 16, 16, (x, y) => ((y % 5 === 0) ? [180, 180, 180] : (N(x, y) < 0.1 ? [210, 210, 210] : [255, 255, 255])), [0.25, 0.25]);
  genTex('spark', 8, 8, (x, y) => { const c = (x === 3 || x === 4) || (y === 3 || y === 4); const d = Math.abs(x - 3.5) + Math.abs(y - 3.5);

}
function signTex(text, bg = 10, fg = 0) { // Schild mit Pixelfont-Beschriftung

varying vec2 vUv;
float bayer2(vec2 a){ a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }

function resize() { // Letterbox: größtmögliche 4:3-Fläche

// --- Geometrie-Helfer ---
function setColors(geo, fn) { // fn(x,y,z) -> [r,g,b]
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) { const c = fn(pos.getX(i), pos.getY(i), pos.getZ(i)); col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2]; }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); return geo;
}
function colorGeo(geo, rgb, grad = 0.35) { // Vertexfarbe mit vertikalem Verlauf (gebackene Pseudo-AO)
  geo.computeBoundingBox(); const bb = geo.boundingBox; const h = Math.max(bb.max.y - bb.min.y, 0.0001);
  return setColors(geo, (x, y) => { const f = 1 - grad + grad * (y - bb.min.y) / h; return [rgb[0] * f, rgb[1] * f, rgb[2] * f]; });
}
function boxGeo(sx, sy, sz, tex) { // Box mit Welt-UVs, damit Texturen nicht gestreckt werden
  const g = new THREE.BoxGeometry(sx, sy, sz);
  const tw = TEXW[tex] || [1, 1];
  if (tw !== 'stretch') {
    const pos = g.attributes.position, nor = g.attributes.normal, uv = g.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i) + sx / 2, y = pos.getY(i) + sy / 2, z = pos.getZ(i) + sz / 2;
      const nx = Math.abs(nor.getX(i)), ny = Math.abs(nor.getY(i));
      if (nx > 0.5) uv.setXY(i, z / tw[0], y / tw[1]); else if (ny > 0.5) uv.setXY(i, x / tw[0], z / tw[0]); else uv.setXY(i, x / tw[0], y / tw[1]);
    }
  }
  return g;
}
function part(sx, sy, sz, rgb, tex = 'white', o = {}) { // Körperteil für Figuren (Ursprung oben bei hang)
  const g = boxGeo(sx, sy, sz, tex);
  if (o.hang) g.translate(0, -sy / 2, 0);
  colorGeo(g, rgb, o.grad == null ? 0.3 : o.grad);
  return new THREE.Mesh(g, mat(tex, { emissive: o.emissive || 0 }));
}
function disposeTree(obj) { obj.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }

/* ======================= 5. AUDIO (rein prozedural, WebAudio) ======================= */
const AudioSys = (() => {
  let ctx = null, out, lp, bus, revIn, noiseBuf, volume = CONFIG.VOLUME;
  const L = {}; // Dauer-Ebenen: drone, wind, pad, hum, tension
  const LAYER_GAIN = { drone: 0.55, wind: 0.32, pad: 0.3, hum: 0.4, tension: 0.22 };
  let base = { drone: 0, wind: 0, pad: 0, hum: 0, tension: 0 }, danger = 0, silentT = 0, lastTension = -1, hbT = 0, alarmT = 0, tick = 0;

    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4200; lp.Q.value = 0.3; // gedämpfte Gesamt-Atmosphäre

    revIn = ctx.createGain(); const revOut = ctx.createGain(); revOut.gain.value = 0.4;
    revIn.connect(conv); conv.connect(revOut); revOut.connect(lp);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    buildLayers(); applyLayers(2);
  }
  function impulse(sec, decay) { // künstlicher Metallhall
    const len = ctx.sampleRate * sec | 0, b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
    return b;
  }
  function dest(vol = 1, rev = 0.25, pan = 0) {
    const g = ctx.createGain(); g.gain.value = vol; let n = g;
    if (pan && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); n = p; }
    n.connect(bus);

  }

    [[43.65, 'sawtooth', 0.25], [43.95, 'sawtooth', 0.25], [87.2, 'sine', 0.2], [65.4, 'sine', 0.12]].forEach(([f, t, v]) => {
      const o = ctx.createOscillator(); o.type = t; o.frequency.value = f; const g = ctx.createGain(); g.gain.value = v; o.connect(g); g.connect(dlp); o.start(); });

    em.gain.setValueAtTime(0.22, t + 0.6); em.gain.exponentialRampToValueAtTime(0.0001, t + 0.85); em.connect(filt('lowpass', 600, 2, d));
    const o = osc('sawtooth', heavy ? 52 : 90, t, t + 0.9, em); o.frequency.linearRampToValueAtTime(heavy ? 78 : 140, t + 0.7);

    for (let i = 0; i < 9; i++) { const ti = t + rand(0.02, 0.7); osc('sine', rand(2500, 6000), ti, ti + 0.15, envG(d, ti, 0.001, 0.15, 0.1)); } };

const BIND = {
  up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  action: ['Space', 'Enter', 'KeyE'], run: ['ShiftLeft', 'ShiftRight'], aim: ['KeyF', 'KeyK'], turn: ['KeyQ'],
  inv: ['KeyI', 'Tab'], pause: ['Escape', 'KeyP'], cancel: ['Escape', 'Backspace', 'KeyX'], crt: ['KeyC'], fps: ['Backquote'],
};
const ALL_BOUND = new Set([].concat(...Object.values(BIND)));
const Input = {
  keys: {}, hit: {},
  down(a) { return BIND[a].some(k => this.keys[k]); },
  pressed(a) { return BIND[a].some(k => this.hit[k]); },
  endFrame() { this.hit = {}; },
};
window.addEventListener('keydown', e => {
  AudioSys.init();
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (ALL_BOUND.has(e.code)) e.preventDefault();
  if (!Input.keys[e.code]) Input.hit[e.code] = true;
  Input.keys[e.code] = true;
});
window.addEventListener('keyup', e => { Input.keys[e.code] = false; });
window.addEventListener('blur', () => { Input.keys = {}; });
canvas.addEventListener('pointerdown', () => { canvas.focus(); AudioSys.init(); });

function makePlayerModel() { // ca. 180 Dreiecke
  const part = (sx, sy, sz, rgb, tex = 'white', o = {}) => window.part(sx, sy, sz, rgb, tex, Object.assign({ emissive: 0.14 }, o)); // leichtes Eigenleuchten für Lesbarkeit
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const parka = [0.66, 0.3, 0.15], dark = [0.15, 0.16, 0.19], skin = [0.8, 0.66, 0.56], pants = [0.22, 0.25, 0.32];
  const add = (m, x, y, z, p = body) => { m.position.set(x, y, z); p.add(m); return m; };
  add(part(0.34, 0.2, 0.22, pants), 0, 0.95, 0);
  const torso = add(part(0.42, 0.52, 0.27, parka, 'parka'), 0, 1.31, 0);
  add(part(0.32, 0.09, 0.25, dark), 0, 1.6, 0);
  add(part(0.36, 0.06, 0.2, [0.85, 0.75, 0.2], 'white', { grad: 0 }), 0, 1.2, 0.04); // Reflexstreifen
  const head = new THREE.Group(); head.position.y = 1.64; body.add(head);
  add(part(0.2, 0.24, 0.21, skin, 'white', { grad: 0.2 }), 0, 0.12, 0.01, head);
  add(part(0.27, 0.21, 0.17, parka, 'parka'), 0, 0.15, -0.07, head);
  add(part(0.21, 0.07, 0.18, [0.2, 0.13, 0.09]), 0, 0.255, 0.0, head);
  const mkArm = side => { const g = new THREE.Group(); g.position.set(0.27 * side, 1.52, 0); body.add(g);
    g.add(part(0.12, 0.56, 0.13, parka, 'parka', { hang: true }));
    const h = part(0.09, 0.1, 0.1, dark, 'white', { hang: true }); h.position.y = -0.56; g.add(h); return g; };
  const armL = mkArm(1), armR = mkArm(-1); // Figur blickt nach +z, rechts = -x
  const gun = part(0.05, 0.2, 0.08, [0.14, 0.14, 0.16], 'white', { hang: true }); gun.position.set(0, -0.6, 0.02); armR.add(gun); gun.visible = false;
  const mkLeg = side => { const g = new THREE.Group(); g.position.set(0.1 * side, 0.9, 0); body.add(g);
    g.add(part(0.15, 0.62, 0.17, pants, 'white', { hang: true }));
    const b = part(0.16, 0.28, 0.25, dark, 'white', { hang: true }); b.position.set(0, -0.62, 0.03); g.add(b); return g; };
  return { root, body, head, torso, armL, armR, gun, legL: mkLeg(1), legR: mkLeg(-1) };
}

function doorFrame(room, wall, at) { // Position + Ausrichtung eines Wandobjekts (Normale zeigt in den Raum)
  const W = room.w, D = room.d;
  switch (wall) {
    case 'n': return { x: at, z: -D / 2, ry: 0, nx: 0, nz: 1 };
    case 's': return { x: at, z: D / 2, ry: Math.PI, nx: 0, nz: -1 };
    case 'w': return { x: -W / 2, z: at, ry: Math.PI / 2, nx: 1, nz: 0 };
    default:  return { x: W / 2, z: at, ry: -Math.PI / 2, nx: -1, nz: 0 };
  }
}
function doorSpawn(room, dd) { const f = doorFrame(room, dd.wall, dd.at); return { x: f.x + f.nx * 0.95, z: f.z + f.nz * 0.95, a: Math.atan2(f.nx, f.nz) }; }

const game = {

function freshState() {

           enemies: JSON.parse(JSON.stringify(ENEMY_DEFS)), stats: { time: 0, saves: 0, shots: 0, hits: 0, kills: 0 } };
}

// --- Ablauf: Titel, neues Spiel, Laden, Speichern ---
function resetRuntime() {
  for (const k in E) delete E[k];
  for (const id in S.enemies) ensureEnemyRuntime(id);
  game.timers = []; game.modal = []; game.blackout = 0; game.overrideT = 0; game.dim = 0; game.white = 0; game.flash = 0;
  Object.assign(P, { dead: false, invuln: 0, aiming: false, turnT: -1, shootCD: 0 });

}
function toTitle() {

}
function newGame() {

function saveGame() {

  memSave = data; try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(data)); } catch (e) {}
}
function readSave() { if (memSave) return memSave; try { const d = JSON.parse(localStorage.getItem(CONFIG.SAVE_KEY) || 'null'); return d && d.S ? d : null; } catch (e) { return null; } }

function loadGame() {
  const d = readSave(); if (!d) return false;
  S = JSON.parse(JSON.stringify(d.S)); resetRuntime(); P.hp = d.P.hp;
  for (const id in S.enemies) { const s = S.enemies[id]; // flüchtige KI-Zustände normalisieren
    if (['chase', 'attack', 'stagger', 'search', 'breakout', 'rising'].includes(s.state)) s.state = 'patrol';
    if (s.state === 'dying') s.state = 'dead'; }
  enterRoom(S.room, { x: d.P.x, z: d.P.z, a: d.P.a });

}
function enterRoom(id, sp) {

  P.x = sp.x; P.z = sp.z; P.a = sp.a; P.aiming = false; P.turnT = -1;
  scene.add(PM.root); PM.root.visible = true; PM.root.position.set(P.x, 0, P.z); PM.root.rotation.y = P.a; PM.gun.visible = false;

// --- Kollision (Kreis gegen Raumgrenzen und Boxen) ---
function collide(o, r) {
  const W = ROOM.w / 2 - r, D = ROOM.d / 2 - r;
  o.x = clamp(o.x, -W, W); o.z = clamp(o.z, -D, D);
  for (const s of R.solids) {
    const cx = clamp(o.x, s.x0, s.x1), cz = clamp(o.z, s.z0, s.z1); const dx = o.x - cx, dz = o.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); o.x = cx + dx / d * r; o.z = cz + dz / d * r; }
    else { const pen = [o.x - s.x0, s.x1 - o.x, o.z - s.z0, s.z1 - o.z], m = Math.min(...pen);
      if (m === pen[0]) o.x = s.x0 - r; else if (m === pen[1]) o.x = s.x1 + r; else if (m === pen[2]) o.z = s.z0 - r; else o.z = s.z1 + r; }
  }
}
function moveBody(o, dx, dz, r) { const sx = o.x, sz = o.z; o.x += dx; o.z += dz; collide(o, r); return Math.hypot(o.x - sx, o.z - sz); }
function segAABB(x0, z0, dx, dz, s) { // Liang-Barsky
  let t0 = 0, t1 = 1;
  const ch = (p, q) => { if (Math.abs(p) < 1e-9) return q >= 0; const t = q / p; if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; } else { if (t < t0) return false; if (t < t1) t1 = t; } return true; };
  return ch(-dx, x0 - s.x0) && ch(dx, s.x1 - x0) && ch(-dz, z0 - s.z0) && ch(dz, s.z1 - z0) && t0 <= t1;
}
function losClear(x0, z0, x1, z1) { for (const s of R.solids) { if (s.h < 1.1) continue; if (segAABB(x0, z0, x1 - x0, z1 - z0, s)) return false; } return true; }
const _pv = new THREE.Vector3();
function panOf(x, z) { _pv.set(x, 1.2, z).project(cam); return clamp(_pv.x, -1, 1) * 0.7; }

// --- Spieler (Tank Controls) ---
function updatePlayer(dt) {
  const C = CONFIG.PLAYER;
  P.invuln = Math.max(0, P.invuln - dt); P.shootCD = Math.max(0, P.shootCD - dt); P.recoil = Math.max(0, P.recoil - dt * 5);
  if (P.turnT >= 0) { // 180°-Schnelldrehung
    P.turnT += dt; P.a = wrapA(P.turnFrom + Math.PI * smooth(0, 0.32, P.turnT));
    if (P.turnT >= 0.32) P.turnT = -1; animPlayer(dt, 0, false); return;
  }
  const hasGun = S.inv.includes('pistole');
  const wantAim = hasGun && Input.down('aim');
  if (wantAim && !P.aiming) { P.aiming = true; P.aimT = 0; acquireTarget(); }
  if (!wantAim) P.aiming = false;
  const turn = (Input.down('left') ? 1 : 0) - (Input.down('right') ? 1 : 0);
  if (P.aiming) {
    P.aimT += dt;
    if (P.targetId && turn === 0) { const t = S.enemies[P.targetId]; if (t && targetable(t) && t.room === S.room) P.a += clamp(wrapA(Math.atan2(t.x - P.x, t.z - P.z) - P.a), -6 * dt, 6 * dt); }
    P.a = wrapA(P.a + turn * C.AIM_TURN * dt);
    if (Input.pressed('action') && P.aimT > 0.12) shoot();
    P.moving = false; P.running = false; animPlayer(dt, 0, false); return;
  }
  if (Input.pressed('turn') || (Input.down('down') && Input.pressed('run'))) { P.turnT = 0; P.turnFrom = P.a; AudioSys.step(ROOM.surface, 0.3); return; }
  const mv = Input.down('up') ? 1 : Input.down('down') ? -1 : 0;
  const run = mv > 0 && Input.down('run');
  const spd = mv > 0 ? (run ? C.RUN : C.WALK) : mv < 0 ? -C.BACK : 0;
  P.a = wrapA(P.a + turn * C.TURN * dt * (mv < 0 ? 0.8 : 1) * (run ? 0.85 : 1));
  if (spd !== 0) moveBody(P, Math.sin(P.a) * spd * dt, Math.cos(P.a) * spd * dt, C.RADIUS);
  P.moving = spd !== 0; P.running = run;
  animPlayer(dt, spd, run);
  if (Input.pressed('action')) tryInteract();
}
function animPlayer(dt, spd, run) {
  const m = PM, a = Math.abs(spd);
  if (a > 0) P.ph += dt * a * 4.3;
  const sw = a > 0 ? Math.sin(P.ph) * (run ? 0.75 : 0.5) : 0;
  m.legL.rotation.x = sw; m.legR.rotation.x = -sw;
  if (P.aiming) { const r = -1.5 + P.recoil * 0.4; m.armR.rotation.set(r, 0, 0.1); m.armL.rotation.set(r + 0.15, 0, -0.45); m.gun.visible = true; }
  else { m.armL.rotation.set(-sw * 0.8, 0, 0.06); m.armR.rotation.set(sw * 0.8, 0, -0.06); m.gun.visible = false; }
  m.body.position.y = a > 0 ? Math.abs(Math.cos(P.ph)) * 0.03 * (run ? 1.6 : 1) : 0;
  m.body.rotation.x = run ? 0.12 : 0;
  m.head.rotation.y = P.aiming ? 0 : Math.sin(game.t * 0.4) * 0.15 * (a > 0 ? 0 : 1);
  m.root.position.set(P.x, 0, P.z); m.root.rotation.y = P.a;
  const sg = Math.sign(Math.sin(P.ph));
  if (a > 0 && sg !== P.stepSign && P.stepSign !== 0) AudioSys.step(ROOM.surface, run ? 0.55 : 0.36, 0);
  P.stepSign = sg;
  m.root.visible = !(P.invuln > 0 && Math.floor(game.t * 20) % 2 === 0);
}

// --- Interaktion ---
function tryInteract() {

function useDoor(d) {

    const d = Math.hypot(s.x - P.x, s.z - P.z), ang = Math.abs(wrapA(Math.atan2(s.x - P.x, s.z - P.z) - P.a));

function updateCamera(dt) {
  let c;
  if (game.overrideT > 0 && game.camOverride) { game.overrideT -= dt; c = game.camOverride; }
  else { const cams = ROOM.cams;
    c = (game.cam && cams.includes(game.cam) && inZone(game.cam.zone, P.x, P.z, 0.3)) ? game.cam : (cams.find(k => inZone(k.zone, P.x, P.z, 0)) || cams[0]);
    game.cam = c; }
  cam.position.set(c.pos[0], c.pos[1], c.pos[2]); cam.lookAt(c.look[0], c.look[1], c.look[2]);
  if (game.shake > 0) { cam.position.x += rand(-1, 1) * game.shake * 0.07; cam.position.y += rand(-1, 1) * game.shake * 0.07; }
  if (cam.fov !== (c.fov || CONFIG.FOV)) { cam.fov = c.fov || CONFIG.FOV; cam.updateProjectionMatrix(); }
}
const LS = [0, 1, 2, 3].map(() => ({ f: 1, drop: 0 }));
function updateLights(dt) {
  const list = inDoorScene() ? DOOR_LIGHTS : activeLights();
  for (let i = 0; i < 4; i++) {
    const L = list[i], st = LS[i], pos = U.uLightPos.value[i], col = U.uLightCol.value[i];
    if (!L) { col.set(0, 0, 0); U.uLightRange.value[i] = 1; continue; }
    const fl = L.flicker || 0;
    if (st.drop > 0) st.drop -= dt; else if (Math.random() < fl * 0.03) st.drop = rand(0.04, 0.18);
    st.f = lerp(st.f, st.drop > 0 ? 0.08 : 1 - fl * 0.35 * Math.random(), clamp(dt * 25, 0, 1));
    const k = st.f * (game.blackout > 0 && !inDoorScene() ? (Math.random() < 0.08 ? 0.5 : 0) : 1);
    let c = L.c;
    if (S && S.flags.alarm && i === 0 && !ROOM.safe && !inDoorScene()) { const a = 0.5 + 0.5 * Math.sin(game.t * 4.5); c = [lerp(c[0], 1.0, a), lerp(c[1], 0.05, a), lerp(c[2], 0.04, a)]; }
    pos.set(L.p[0], L.p[1], L.p[2]); col.set(c[0] * k, c[1] * k, c[2] * k); U.uLightRange.value[i] = L.r;
  }
  if (game.muzzle > 0) { game.muzzle -= dt; U.uLightPos.value[3].set(P.x + Math.sin(P.a) * 0.7, 1.4, P.z + Math.cos(P.a) * 0.7); U.uLightCol.value[3].set(1.4, 1.1, 0.7); U.uLightRange.value[3] = 6; }
}

  const f = ROOM.fog; U.uFogColor.value.set(f.color[0], f.color[1], f.color[2]); U.uFogNear.value = f.near * CONFIG.FOG_SCALE; U.uFogFar.value = f.far * CONFIG.FOG_SCALE;
  const amb = (S.flags.power && ROOM.ambientPower) || ROOM.ambient; U.uAmbient.value.set(amb[0], amb[1], amb[2]);
}

// --- Hauptupdate im freien Spiel ---
function updatePlay(dt) {
  S.stats.time += dt;
  if (Input.pressed('inv')) { openInventory(); return; }
  if (Input.pressed('pause')) { pushModal({ type: 'pause', sel: 0 }); AudioSys.confirm(); return; }
  updatePlayer(dt);
  let danger = 0;
  for (const id of enemiesHere()) {
    updateEnemy(id, dt); const s = S.enemies[id], d = Math.hypot(s.x - P.x, s.z - P.z);
    if (['chase', 'attack', 'rising', 'breakout'].includes(s.state)) danger = Math.max(danger, 1 - clamp((d - 1) / 12, 0, 0.6));
    else if (s.state === 'patrol' || s.state === 'search') danger = Math.max(danger, 0.35 * clamp(1 - d / 9, 0, 1));
  }
  game.danger = danger;
  separate();
  for (const id in E) { // Verfolgung durch Türen
    const e = E[id], f = e.follow; if (!f) continue; const s = S.enemies[id];
    if (f.room !== S.room || !alive(s)) { e.follow = null; if (alive(s) && s.state === 'chase') s.state = 'search'; continue; }
    f.t -= dt;
    if (f.t <= 0) { e.follow = null; const sp = doorSpawn(ROOM, ROOM.doors.find(x => x.id === f.door));
      Object.assign(s, { room: S.room, x: sp.x, z: sp.z, a: sp.a, state: 'chase' });
      spawnEnemyMesh(id); e.attackCD = 1.0; e.lastSeen = 0; e.lkx = P.x; e.lkz = P.z;
      AudioSys.door('door'); AudioSys.groan(0.8, panOf(sp.x, sp.z)); }
  }
  updateTimers(dt);
  updateParticles(dt);
}

}
function drawTitle() {
  const g = ui.createLinearGradient(0, 0, 0, 240); g.addColorStop(0, 'rgba(0,0,0,0.75)'); g.addColorStop(0.45, 'rgba(0,0,0,0.15)'); g.addColorStop(1, 'rgba(0,0,0,0.85)');
  ui.fillStyle = g; ui.fillRect(0, 0, 320, 240);
  const tt = 'THULE-9', jx = Math.random() < 0.04 ? 1 : 0;
  drawText(ui, tt, 160 - textW(tt, 4) / 2 + jx, 40, PAL[7], 4);
  ui.fillStyle = PAL[9]; ui.fillRect(160 - textW(tt, 4) / 2, 74, textW(tt, 4), 2);
  const sub = 'Polarstation, 78° Nord'; drawText(ui, sub, 160 - textW(sub) / 2, 84, PAL[5]);
  titleItems().forEach((it, i) => { const sel = i === game.title.sel, w = textW(it.t), x = 160 - w / 2, y = 140 + i * 15;
    if (sel && blink(3)) drawText(ui, '►', x - 12, y, PAL[11]); drawText(ui, it.t, x, y, sel ? PAL[11] : PAL[6]); });
  const h = 'WASD/Pfeile  Leertaste  F zielen  I Inventar'; drawText(ui, h, 160 - textW(h) / 2, 214, PAL[4]);
  const h2 = 'Kopfhörer empfohlen'; drawText(ui, h2, 160 - textW(h2) / 2, 226, PAL[3]);
}

// --- Game Over ---
function goItems() { const a = []; if (hasSave()) a.push({ k: 'load', t: 'Letzten Spielstand laden' }); a.push({ k: 'new', t: 'Neu beginnen' }, { k: 'title', t: 'Hauptmenü' }); return a; }
function updateGameOver(dt) {
  const o = game.over, it = goItems(); o.t += dt; if (o.t < 1) return;
  if (Input.pressed('up')) { o.sel = (o.sel + it.length - 1) % it.length; AudioSys.blip(); }
  if (Input.pressed('down')) { o.sel = (o.sel + 1) % it.length; AudioSys.blip(); }
  if (Input.pressed('action')) { AudioSys.confirm(); const k = it[o.sel].k; if (k === 'load') loadGame(); else if (k === 'new') newGame(); else toTitle(); }
}
function drawGameOver() {
  const a = clamp(game.over.t / 1.0, 0, 1); ui.globalAlpha = a;
  const t = 'Du bist gestorben.'; drawText(ui, t, 160 - textW(t, 2) / 2, 80, PAL[9], 2);
  goItems().forEach((it, i) => { const sel = i === game.over.sel, x = 160 - textW(it.t) / 2, y = 130 + i * 15;
    if (sel && blink(3)) drawText(ui, '►', x - 12, y, PAL[11]); drawText(ui, it.t, x, y, sel ? PAL[11] : PAL[6]); });
  ui.globalAlpha = 1;
}

// --- Ende ---
const ENDING = [
  'Die Karte gleitet durch den Leser. Das rote Licht erlischt. QUARANTÄNE AUFGEHOBEN.',
  'Draußen: Sturm. Weißes Rauschen bis zum Horizont. Das Kettenfahrzeug springt beim dritten Versuch an.',
  '02:14 Uhr. Funkspruch an Longyearbyen: „Station THULE-9 verloren. Keine Überlebenden.“',
  'Im Rückspiegel versinkt die Station im Schnee. Die Heizung im Fahrerhaus läuft auf höchster Stufe.',
  'Dir ist trotzdem warm. Viel zu warm.',
];
function startEnding() {
  game.mode = 'ending'; game.end = { t: 0, page: 0, shown: 0, phase: 'fade' }; S.flags.alarm = false; game.modal = [];
  AudioSys.door('doorHeavy'); AudioSys.setAmbience({ wind: 1.0, drone: 0.1, pad: 0.25 }, 3);
}
function updateEnding(dt) {
  const en = game.end; en.t += dt;
  if (en.phase === 'fade') { game.white = smooth(0.4, 2.4, en.t); if (en.t > 2.6) { en.phase = 'text'; en.t = 0; } return; }
  game.white = 0;
  if (en.phase === 'text') {
    const txt = normText(ENDING[en.page]), before = Math.floor(en.shown); en.shown = Math.min(txt.length, en.shown + dt * CONFIG.TEXT_SPEED * 0.7);
    if (Math.floor(en.shown) > before) AudioSys.tick();
    if (Input.pressed('action')) { if (en.shown < txt.length) en.shown = txt.length; else { en.page++; en.shown = 0; AudioSys.blip(); if (en.page >= ENDING.length) { en.phase = 'stats'; en.t = 0; AudioSys.sting(0.3); } } }
    return;
  }
  if (en.t > 1.5 && Input.pressed('action')) toTitle();
}
function drawEnding() {
  const en = game.end; if (en.phase === 'fade') return;
  ui.fillStyle = '#000'; ui.fillRect(0, 0, 320, 240);
  if (en.phase === 'text') {
    const lines = wrapText(normText(ENDING[en.page]), 42); let rem = Math.floor(en.shown); const y0 = 120 - lines.length * 6;
    lines.forEach((l, j) => { drawText(ui, l.slice(0, Math.max(0, rem)), 34, y0 + j * 12, en.page === ENDING.length - 1 ? PAL[9] : PAL[6]); rem -= l.length; });
    if (en.shown >= normText(ENDING[en.page]).length && blink()) drawText(ui, '▼', 280, 200, PAL[10]);
    return;
  }
  const a = clamp(en.t / 1.2, 0, 1); ui.globalAlpha = a;
  drawText(ui, 'Ende', 160 - textW('Ende', 3) / 2, 60, PAL[7], 3);
  const st = S.stats, acc = st.shots ? Math.round(st.hits / st.shots * 100) + '%' : '-';
  [['Spielzeit', fmtTime(st.time)], ['Gespeichert', String(st.saves)], ['Schüsse / Treffer', st.shots + ' / ' + st.hits + ' (' + acc + ')'], ['Gegner besiegt', st.kills + ' / 3']]
    .forEach(([k, v], i) => { drawText(ui, k, 70, 110 + i * 14, PAL[5]); drawText(ui, v, 250 - textW(v), 110 + i * 14, PAL[11]); });
  if (en.t > 1.5 && blink()) { const h = 'Leertaste: Hauptmenü'; drawText(ui, h, 160 - textW(h) / 2, 200, PAL[4]); }
  ui.globalAlpha = 1;
}

// --- HUD (minimal, Resident-Evil-Stil) ---
function drawHUD() {
  if (game.roomNameT > 0) { ui.globalAlpha = Math.min(1, game.roomNameT) * (game.roomNameT > 2.8 ? (3.2 - game.roomNameT) / 0.4 : 1);
    drawText(ui, ROOM.name, 12, 12, PAL[6]); ui.fillStyle = PAL[10]; ui.fillRect(12, 22, textW(ROOM.name), 1); ui.globalAlpha = 1; }
  if (P.aiming) { const s = '9mm ' + S.ammo; drawText(ui, s, 308 - textW(s), 226, S.ammo > 0 ? PAL[11] : PAL[9]); }
}
function drawUI() {
  ui.clearRect(0, 0, 320, 240);
  if (game.mode === 'title') drawTitle();
  else if (game.mode === 'play') { drawHUD(); game.modal.forEach(drawModal); }
  else if (game.mode === 'gameover') drawGameOver();
  else if (game.mode === 'ending') drawEnding();
  if (game.showFps) drawText(ui, Math.round(game.fps) + ' FPS', 4, 230, PAL[14]);
  uiTex.needsUpdate = true;
}

/* ======================= 12. HAUPTSCHLEIFE ======================= */
function updateEffects(dt) {
  game.shake = Math.max(0, game.shake - dt * 1.5); game.flash = Math.max(0, game.flash - dt * 1.8);
  game.blackout = Math.max(0, game.blackout - dt); game.roomNameT = Math.max(0, game.roomNameT - dt);
  if ((game.mode === 'play' || game.mode === 'title') && !game.title.start && game.fade > 0) game.fade = Math.max(0, game.fade - dt * 1.2);
  const u = postMat.uniforms; u.uTime.value = game.t; u.uFade.value = game.fade; u.uDim.value = game.dim; u.uFlash.value = game.flash * 0.6; u.uWhite.value = game.white;
}
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now; game.t += dt;
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { game.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  if (Input.pressed('crt') && !(topModal() && topModal().type === 'keypad')) { game.settings.crt = !game.settings.crt; applySettings(); saveSettings(); }
  if (Input.pressed('fps')) game.showFps = !game.showFps;
  switch (game.mode) {
    case 'title': updateTitle(dt); break;
    case 'play': if (game.modal.length) updateModal(dt); else updatePlay(dt); break;
    case 'door': updateDoor(dt); break;
    case 'dying': updateDying(dt); break;
    case 'gameover': updateGameOver(dt); break;
    case 'ending': updateEnding(dt); break;
  }
  if (game.mode !== 'title') updateCamera(dt);
  updateItems(); updateLights(dt); envUniforms(); updateEffects(dt);
  AudioSys.update(dt, game.mode === 'play' ? game.danger : 0, game.mode === 'play' ? P.hp : 3, !!(S.flags.alarm && game.mode === 'play'));
  drawUI();
  if (inDoorScene()) renderFrame(DS.scene, DS.cam); else renderFrame(scene, cam);
  Input.endFrame();
}
function init() {
  buildTextures(); loadSettings(); resize();
  PM = makePlayerModel(); scene.add(PM.root);
  toTitle(); canvas.focus();
  requestAnimationFrame(frame);
}
init();
window.THULE = { game, get S() { return S; }, P, E, enterRoom, newGame, loadGame, ROOMS }; // Debug-Zugriff
</script>
